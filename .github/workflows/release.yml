name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish, for example v0.1.0
        required: true

# Least privilege by default; only the publishing job is granted write access.
# Actions are pinned to a commit SHA rather than a mutable tag so a retagged
# upstream release cannot silently change what publishes a release. Dependabot
# proposes SHA bumps on the weekly github-actions schedule.
permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
      tarball: ${{ steps.pack.outputs.tarball }}
      prerelease: ${{ steps.identity.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      - name: Resolve release identity from the tag
        id: identity
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          prerelease=false
          case "$version" in 0.*|*-*) prerelease=true ;; esac
          {
            echo "tag=$TAG"
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Verify the tag, package version, and changelog agree
        run: node scripts/release.mjs verify --tag "${{ steps.identity.outputs.tag }}"

      - run: npm run lint

      - run: npm test

      - name: Build the release tarball
        id: pack
        run: |
          set -euo pipefail
          tarball="$(npm pack --silent)"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Smoke-test the built artifact in a clean environment
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          VERSION: ${{ steps.identity.outputs.version }}
          PROJECT_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          consumer="$(mktemp -d)"
          tarball="$PWD/$TARBALL"
          cd "$consumer"
          npm init -y --silent > /dev/null
          npm install --silent --ignore-scripts "$tarball"
          bin="$consumer/node_modules/.bin/agent-trestle"
          test "$("$bin" --version)" = "$VERSION"
          "$bin" --help | grep -Fq "$PROJECT_URL"
          "$bin" --help | grep -Fq "$PROJECT_URL/issues"
          "$bin" --version --json | grep -Fq "\"version\":\"$VERSION\""

      - name: Generate release notes from the changelog
        run: |
          node scripts/release.mjs notes \
            --tag "${{ steps.identity.outputs.tag }}" \
            --out release-notes.md

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ steps.identity.outputs.version }}
          path: |
            ${{ steps.pack.outputs.tarball }}
            release-notes.md
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-${{ needs.verify.outputs.version }}

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify.outputs.tag }}
          TITLE: Agent Trestle ${{ needs.verify.outputs.version }}
          TARBALL: ${{ needs.verify.outputs.tarball }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file release-notes.md "${flags[@]}"
            gh release upload "$TAG" "$TARBALL" --clobber
          else
            gh release create "$TAG" "$TARBALL" \
              --title "$TITLE" --notes-file release-notes.md "${flags[@]}"
          fi

  publish-npm:
    name: Publish to npm
    needs: [verify, publish]
    # npm accepts a trusted publisher only for a package that already exists, so
    # this job stays dormant until the one-time bootstrap described in
    # CONTRIBUTING.md is done and the repository variable NPM_PUBLISH is set to
    # "enabled". A published version cannot be taken back, so it runs only after
    # the GitHub release succeeded.
    if: vars.NPM_PUBLISH == 'enabled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Mints the OIDC token that authenticates the publish and signs provenance.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Use an npm release that supports trusted publishing
        run: npm install --global npm@^11.5.1

      - name: Publish the tagged version
        id: publish
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          published="$(npm view "agent-trestle@$VERSION" version 2>/dev/null || true)"
          if [ -n "$published" ]; then
            echo "agent-trestle@$VERSION is already on the registry; nothing to publish."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          dist_tag=latest
          case "$VERSION" in *-*) dist_tag=next ;; esac
          npm publish --access public --tag "$dist_tag"
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Verify the version resolves from the registry
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          for _ in 1 2 3 4 5; do
            if [ "$(npm view "agent-trestle@$VERSION" version 2>/dev/null || true)" = "$VERSION" ]; then
              echo "agent-trestle@$VERSION resolves from the registry."
              exit 0
            fi
            sleep 10
          done
          echo "agent-trestle@$VERSION did not resolve from the registry." >&2
          exit 1

      - name: Confirm the publish was tokenless
        # This repository stores no npm credential and never passes
        # --provenance, so a provenance attestation can only have come from
        # trusted publishing. Its absence means the trusted publisher on
        # npmjs.com is missing or does not match this workflow, and the release
        # must fail loudly rather than leave an unattested version behind.
        if: steps.publish.outputs.published == 'true'
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          attestation=""
          for _ in 1 2 3 4 5; do
            attestation="$(npm view "agent-trestle@$VERSION" dist.attestations.url 2>/dev/null || true)"
            [ -n "$attestation" ] && break
            sleep 10
          done
          if [ -z "$attestation" ]; then
            echo "::error::agent-trestle@$VERSION carries no provenance attestation, so it was not published through trusted publishing. Register the trusted publisher for this package on npmjs.com; see the 'Publishing to npm' section of CONTRIBUTING.md."
            exit 1
          fi
          echo "Provenance attestation: $attestation"
